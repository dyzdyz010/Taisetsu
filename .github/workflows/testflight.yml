name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - "Taisetsu/**"
      - "TaisetsuCore/**"
      - "TaisetsuWidget/**"
      - "TaisetsuTests/**"
      - "TaisetsuUITests/**"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  APPLE_TEAM_ID: 2FBFFBNMS3
  APP_BUNDLE_ID: com.dyz.Taisetsu
  SCHEME: Taisetsu

jobs:
  archive-and-upload:
    name: Verify, archive, and upload
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Validate repository and generated files
        run: |
          bash scripts/naming-check.sh
          xcodegen generate
          git diff --exit-code -- Taisetsu.xcodeproj Taisetsu/Info.plist Taisetsu/Taisetsu.entitlements TaisetsuWidget/Info.plist TaisetsuWidget/TaisetsuWidget.entitlements
          swift scripts/generate-localizations.swift --check
          bash scripts/localization-check.sh
          bash scripts/app-icon-check.sh

      - name: Lint Swift formatting
        run: xcrun swift-format lint --recursive Taisetsu TaisetsuCore TaisetsuWidget TaisetsuTests TaisetsuUITests

      - name: Build for simulator
        run: xcodebuild build -project Taisetsu.xcodeproj -scheme "$SCHEME" -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests and coverage
        run: |
          bash scripts/ci-test.sh
          bash scripts/coverage-check.sh

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
        run: |
          : "${ASC_KEY_ID:?Missing APPSTORE_CONNECT_KEY_ID secret}"
          : "${ASC_ISSUER_ID:?Missing APPSTORE_CONNECT_ISSUER_ID secret}"
          : "${ASC_PRIVATE_KEY:?Missing APPSTORE_CONNECT_PRIVATE_KEY secret}"
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$key_path" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Archive signed app
        run: |
          rm -rf "$RUNNER_TEMP/Taisetsu.xcarchive"
          xcodebuild archive \
            -project Taisetsu.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Taisetsu.xcarchive" \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Taisetsu.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ci/ExportOptions-TestFlight.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        run: |
          ipa_path=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa_path"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$ipa_path" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload archive evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testflight-archive-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/Taisetsu.xcarchive/dSYMs
            ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
          retention-days: 7
