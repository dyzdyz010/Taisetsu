name: Taisetsu

options:
  bundleIdPrefix: com.dyz
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TaisetsuCore:
    type: framework
    platform: iOS
    sources:
      - path: TaisetsuCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.TaisetsuCore
        PRODUCT_NAME: TaisetsuCore
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES

  Taisetsu:
    type: application
    platform: iOS
    sources:
      - path: Taisetsu
    dependencies:
      - target: TaisetsuCore
      - target: TaisetsuWidget
    info:
      path: Taisetsu/Info.plist
      properties:
        CFBundleDisplayName: Taisetsu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        NSCalendarsFullAccessUsageDescription: Taisetsu automatically keeps your important days in a dedicated Calendar.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Taisetsu/Taisetsu.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.dyz.Taisetsu
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.dyz.Taisetsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.Taisetsu
        DEVELOPMENT_TEAM: 2FBFFBNMS3
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"

  TaisetsuWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TaisetsuWidget
    dependencies:
      - target: TaisetsuCore
    info:
      path: TaisetsuWidget/Info.plist
      properties:
        CFBundleDisplayName: Taisetsu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TaisetsuWidget/TaisetsuWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dyz.Taisetsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.Taisetsu.Widget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  TaisetsuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaisetsuTests
    dependencies:
      - target: TaisetsuCore
      - target: Taisetsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.TaisetsuTests
        GENERATE_INFOPLIST_FILE: YES

  TaisetsuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TaisetsuUITests
    dependencies:
      - target: Taisetsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.TaisetsuUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Taisetsu:
    build:
      targets:
        Taisetsu: all
        TaisetsuWidget: all
        TaisetsuCore: all
    test:
      gatherCoverageData: true
      targets:
        - TaisetsuTests
        - TaisetsuUITests
  TaisetsuCore:
    build:
      targets:
        TaisetsuCore: all
    test:
      gatherCoverageData: true
      targets:
        - TaisetsuTests
  TaisetsuWidget:
    build:
      targets:
        TaisetsuWidget: all
