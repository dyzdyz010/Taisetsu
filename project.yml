name: Taisetsu

options:
  bundleIdPrefix: com.dyz
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TaisetsuCore:
    type: framework
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: TaisetsuCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.TaisetsuCore
        PRODUCT_NAME: TaisetsuCore
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES

  Taisetsu:
    type: application
    platform: iOS
    sources:
      - path: Taisetsu
    dependencies:
      - target: TaisetsuCore
      - target: TaisetsuWidget
      - target: TaisetsuWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    info:
      path: Taisetsu/Info.plist
      properties:
        CFBundleDisplayName: Taisetsu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        NSCalendarsFullAccessUsageDescription: Taisetsu automatically keeps your important days in a dedicated Calendar.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Taisetsu/Taisetsu.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.dyz.Taisetsu
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.dyz.Taisetsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.Taisetsu
        DEVELOPMENT_TEAM: 2FBFFBNMS3
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

  TaisetsuWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TaisetsuWidget
    dependencies:
      - target: TaisetsuCore
    info:
      path: TaisetsuWidget/Info.plist
      properties:
        CFBundleDisplayName: Taisetsu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TaisetsuWidget/TaisetsuWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dyz.Taisetsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.Taisetsu.Widget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  TaisetsuWatch:
    type: application
    platform: watchOS
    sources:
      - path: TaisetsuWatch
    dependencies:
      - target: TaisetsuCore
      - target: TaisetsuWatchWidget
    info:
      path: TaisetsuWatch/Info.plist
      properties:
        CFBundleDisplayName: Taisetsu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.dyz.Taisetsu
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: TaisetsuWatch/TaisetsuWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dyz.Taisetsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.Taisetsu.watchkitapp
        DEVELOPMENT_TEAM: 2FBFFBNMS3
        # XcodeGen emits no runpath for watchOS application targets, so dyld would look for
        # TaisetsuCore.framework beside the executable instead of inside Frameworks/ and abort at launch.
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"

  TaisetsuWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: TaisetsuWatchWidget
    dependencies:
      - target: TaisetsuCore
    info:
      path: TaisetsuWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Taisetsu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TaisetsuWatchWidget/TaisetsuWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dyz.Taisetsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.Taisetsu.watchkitapp.Widget
        DEVELOPMENT_TEAM: 2FBFFBNMS3
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"

  TaisetsuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaisetsuTests
    dependencies:
      - target: TaisetsuCore
      - target: Taisetsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.TaisetsuTests
        GENERATE_INFOPLIST_FILE: YES

  TaisetsuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TaisetsuUITests
    dependencies:
      - target: Taisetsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.TaisetsuUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Taisetsu:
    build:
      targets:
        Taisetsu: all
        TaisetsuWidget: all
        TaisetsuCore: all
    test:
      gatherCoverageData: true
      targets:
        - TaisetsuTests
        - TaisetsuUITests
  TaisetsuCore:
    build:
      targets:
        TaisetsuCore: all
    test:
      gatherCoverageData: true
      targets:
        - TaisetsuTests
  TaisetsuWidget:
    build:
      targets:
        TaisetsuWidget: all
  TaisetsuWatch:
    build:
      targets:
        TaisetsuWatch: all
        TaisetsuWatchWidget: all
