name: LifeTimer

options:
  bundleIdPrefix: com.dyz
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LifeTimerCore:
    type: framework
    platform: iOS
    sources:
      - path: LifeTimerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.LifeTimerCore
        PRODUCT_NAME: LifeTimerCore
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES

  LifeTimer:
    type: application
    platform: iOS
    sources:
      - path: LifeTimer
    dependencies:
      - target: LifeTimerCore
      - target: LifeTimerWidget
    info:
      path: LifeTimer/Info.plist
      properties:
        CFBundleDisplayName: 生命倒计时
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: LifeTimer/LifeTimer.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.dyz.LifeTimer
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.dyz.LifeTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.LifeTimer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"

  LifeTimerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LifeTimerWidget
    dependencies:
      - target: LifeTimerCore
    info:
      path: LifeTimerWidget/Info.plist
      properties:
        CFBundleDisplayName: 生命倒计时小组件
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LifeTimerWidget/LifeTimerWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dyz.LifeTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.LifeTimer.Widget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  LifeTimerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LifeTimerTests
    dependencies:
      - target: LifeTimerCore
      - target: LifeTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.LifeTimerTests
        GENERATE_INFOPLIST_FILE: YES

  LifeTimerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LifeTimerUITests
    dependencies:
      - target: LifeTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyz.LifeTimerUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LifeTimer:
    build:
      targets:
        LifeTimer: all
        LifeTimerWidget: all
        LifeTimerCore: all
    test:
      gatherCoverageData: true
      targets:
        - LifeTimerTests
        - LifeTimerUITests
  LifeTimerCore:
    build:
      targets:
        LifeTimerCore: all
    test:
      gatherCoverageData: true
      targets:
        - LifeTimerTests
  LifeTimerWidget:
    build:
      targets:
        LifeTimerWidget: all
